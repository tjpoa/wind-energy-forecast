services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      WIND_FORECAST_CORS_ALLOW_ORIGINS: "${WIND_FORECAST_CORS_ALLOW_ORIGINS:-http://localhost:5173}"
      WIND_FORECAST_PERFORMANCE_ARTIFACT_DIR: /app/performance
      WIND_FORECAST_MONITORING_STORE_ROOT: /app/monitoring
      WIND_FORECAST_DOCUMENT_SYNTHESIS_BACKEND: "${WIND_FORECAST_DOCUMENT_SYNTHESIS_BACKEND:-disabled}"
      WIND_FORECAST_DOCUMENT_SYNTHESIS_MODEL: "${WIND_FORECAST_DOCUMENT_SYNTHESIS_MODEL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
      - type: bind
        source: "${WIND_FORECAST_PERFORMANCE_ARTIFACT_HOST_DIR:-./demo/v1/performance}"
        target: /app/performance
        read_only: true
      - type: bind
        source: ./demo/v1/monitoring
        target: /app/monitoring
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
