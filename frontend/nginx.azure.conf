server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /backend/health {
        limit_except GET { deny all; }
        proxy_pass http://wind-forecast-api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /backend/api/v1/performance {
        limit_except GET { deny all; }
        proxy_pass http://wind-forecast-api/api/v1/performance;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /backend/api/v1/monitoring/ {
        limit_except GET { deny all; }
        proxy_pass http://wind-forecast-api/api/v1/monitoring/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /backend/ {
        return 404;
    }
}
