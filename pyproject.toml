[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-energy-forecast"
version = "0.1.0"
description = "Wind-energy production forecasting utilities."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wind_forecast*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
