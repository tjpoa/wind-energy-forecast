[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-energy-forecast"
version = "0.1.0"
description = "Wind-energy production forecasting utilities."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wind_forecast*"]
