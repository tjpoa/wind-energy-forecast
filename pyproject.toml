[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-energy-forecast"
version = "0.1.0"
description = "Wind-energy production forecasting utilities."
requires-python = ">=3.10"

[project.scripts]
wind-forecast-batch = "wind_forecast.batch_cli:main"
wind-forecast-validate-manifest = "wind_forecast.manifest_validation:main"
wind-forecast-build-v1 = "wind_forecast.v1_preprocessing:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wind_forecast*"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=wind_forecast",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=30",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
