name: Apply Azure foundation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

env:
  PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
  TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
  TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
  TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
  TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
  TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
  TF_VAR_environment_name: ${{ vars.AZURE_ENVIRONMENT_NAME || 'wind-forecast-demo-env' }}
  TF_VAR_runtime_identity_name: ${{ vars.AZURE_RUNTIME_IDENTITY_NAME || 'wind-forecast-demo-runtime' }}

jobs:
  plan-foundation:
    name: Plan Terraform foundation
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}

    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4

      - name: Run protected Azure preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: foundation-plan
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with foundation planner OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the foundation backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/foundation init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=foundation.tfstate"

      - name: Generate Terraform foundation plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation plan -input=false -lock-timeout=5m -out=foundation.tfplan

      - name: Reject destructive or replacement changes before production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Publish non-sensitive foundation plan summary
        shell: bash
        run: |
          {
            echo "## Terraform foundation plan (pre-approval)"
            echo
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
            echo
            echo '```json'
            terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | \
              jq '{resource_changes: [.resource_changes[]? | {address, actions: .change.actions}]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-foundation:
    name: Apply approved Terraform foundation
    needs: plan-foundation
    if: ${{ needs.plan-foundation.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}

    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4

      - name: Run protected Azure preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: foundation-apply
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with protected foundation OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the foundation backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/foundation init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=foundation.tfstate"

      - name: Generate the exact foundation plan to apply
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation plan -input=false -lock-timeout=5m -out=foundation.tfplan

      - name: Reject destructive or replacement changes after production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Apply the exact approved foundation plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation apply -input=false foundation.tfplan

      - name: Verify Terraform foundation state is drift-free after apply
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform -chdir=infra/azure/terraform/foundation plan \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -out=post-foundation.tfplan
          plan_exit=$?
          set -e

          {
            echo "## Terraform foundation post-apply verification"
            echo
            echo "- Applied after the protected \`production\` maintainer confirmation."
            echo "- The foundation state key is \`foundation.tfstate\`."
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
          } >> "$GITHUB_STEP_SUMMARY"

          case "$plan_exit" in
            0)
              echo "- Result: drift-free (Terraform detailed exit code 0)." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              {
                echo "- Result: drift detected; the workflow failed closed."
                echo
                echo '```json'
                terraform -chdir=infra/azure/terraform/foundation show \
                  -json post-foundation.tfplan | \
                  jq '{resource_changes: [.resource_changes[]? | select((.change.actions // []) != ["no-op"]) | {address, actions: .change.actions}]}'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Terraform detected drift after the protected foundation apply." >&2
              exit 1
              ;;
            *)
              echo "- Result: plan failed with exit code ${plan_exit}." >> "$GITHUB_STEP_SUMMARY"
              echo "Post-apply Terraform foundation plan failed with exit code ${plan_exit}." >&2
              exit "$plan_exit"
              ;;
          esac
