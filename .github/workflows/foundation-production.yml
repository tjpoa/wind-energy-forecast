name: Apply Azure foundation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

env:
  PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
  TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
  TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
  TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
  TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
  TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
  TF_VAR_environment_name: ${{ vars.AZURE_ENVIRONMENT_NAME || 'wind-forecast-demo-env' }}
  TF_VAR_runtime_identity_name: ${{ vars.AZURE_RUNTIME_IDENTITY_NAME || 'wind-forecast-demo-runtime' }}
  READINESS_SOURCE_SHA: ${{ github.sha }}

jobs:
  readiness-planner:
    name: Readiness foundation planner and remote state
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}
    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4
      - name: Run foundation planner readiness preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: foundation-plan
          identity: planner
          azure-client-id: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
          github-token: ${{ github.token }}
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          output-path: azure-readiness-foundation-plan.json

  readiness-deployer:
    name: Readiness protected foundation deployer
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}
    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4
      - name: Run foundation deployer readiness preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: foundation-apply
          identity: deployer
          azure-client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          github-token: ${{ github.token }}
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          output-path: azure-readiness-foundation-apply.json

  readiness-gate:
    name: Aggregate protected foundation readiness
    needs:
      - readiness-planner
      - readiness-deployer
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected master commit
        if: ${{ always() }}
        uses: actions/checkout@v4
      - name: Download component readiness receipts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: azure-readiness-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-components
          merge-multiple: true
      - name: Build aggregate readiness receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-aggregate \
            --directory readiness-components \
            --modes foundation-plan,foundation-apply \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output azure-readiness.json
      - name: Upload immutable aggregate readiness receipt
        if: ${{ always() }}
        id: upload_readiness
        uses: actions/upload-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: azure-readiness.json
          if-no-files-found: error
          retention-days: 90
      - name: Record readiness evidence in job summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_id="unavailable"
          if [[ -f azure-readiness.json ]]; then
            receipt_id="$(jq -r '.receipt_id' azure-readiness.json)"
          fi
          {
            echo "### Azure readiness"
            echo "- Receipt ID / SHA-256: \`$receipt_id\`"
            echo "- Artifact digest: \`${{ steps.upload_readiness.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed on aggregate readiness
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path azure-readiness.json \
            --assert-go \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

  plan-foundation:
    name: Plan Terraform foundation
    needs: readiness-gate
    if: ${{ needs.readiness-gate.result == 'success' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}

    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4

      - name: Download aggregate readiness receipt
        uses: actions/download-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness

      - name: Validate readiness before Terraform initialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path readiness/azure-readiness.json \
            --mode foundation-plan \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with foundation planner OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the foundation backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/foundation init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=foundation.tfstate"

      - name: Generate Terraform foundation plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation plan -input=false -lock-timeout=5m -out=foundation.tfplan

      - name: Reject destructive or replacement changes before production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Publish non-sensitive foundation plan summary
        shell: bash
        run: |
          {
            echo "## Terraform foundation plan (pre-approval)"
            echo
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
            echo
            echo '```json'
            terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | \
              jq '{resource_changes: [.resource_changes[]? | {address, actions: .change.actions}]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-foundation:
    name: Apply approved Terraform foundation
    needs:
      - plan-foundation
      - readiness-gate
    if: ${{ needs.plan-foundation.result == 'success' && needs.readiness-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}

    steps:
      - name: Check out the protected master commit
        uses: actions/checkout@v4

      - name: Download aggregate readiness receipt
        uses: actions/download-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness

      - name: Validate readiness before Terraform initialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path readiness/azure-readiness.json \
            --mode foundation-apply \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with protected foundation OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the foundation backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/foundation init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=foundation.tfstate"

      - name: Generate the exact foundation plan to apply
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation plan -input=false -lock-timeout=5m -out=foundation.tfplan

      - name: Reject destructive or replacement changes after production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation show -json foundation.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Apply the exact approved foundation plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/foundation apply -input=false foundation.tfplan

      - name: Verify Terraform foundation state is drift-free after apply
        id: post_foundation_drift
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_terraform_drift.py \
            --directory infra/azure/terraform/foundation \
            --plan-path post-foundation.tfplan \
            --operation foundation-apply
