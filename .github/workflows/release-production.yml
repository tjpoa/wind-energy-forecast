name: Release production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

env:
  PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  READINESS_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  readiness-publisher:
    name: Readiness publisher OIDC and ACR permissions
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      AZURE_PUBLISHER_CLIENT_ID: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Run publisher readiness preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: release-publish
          identity: publisher
          azure-client-id: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
          github-token: ${{ github.token }}
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          output-path: azure-readiness-release-publish.json

  readiness-planner:
    name: Readiness planner OIDC, state, and permissions
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      AZURE_PUBLISHER_CLIENT_ID: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Run planner readiness preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: release-plan
          identity: planner
          azure-client-id: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
          github-token: ${{ github.token }}
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          output-path: azure-readiness-release-plan.json

  readiness-deployer:
    name: Readiness protected deployer and production environment
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}
    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Run deployer readiness preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: release-deploy
          identity: deployer
          azure-client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          github-token: ${{ github.token }}
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          output-path: azure-readiness-release-deploy.json

  readiness-gate:
    name: Aggregate protected Azure readiness
    needs:
      - readiness-publisher
      - readiness-planner
      - readiness-deployer
    if: ${{ always() && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI commit
        if: ${{ always() }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Download component readiness receipts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: azure-readiness-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness-components
          merge-multiple: true
      - name: Build aggregate readiness receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-aggregate \
            --directory readiness-components \
            --modes release-publish,release-plan,release-deploy \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output azure-readiness.json
      - name: Upload immutable aggregate readiness receipt
        if: ${{ always() }}
        id: upload_readiness
        uses: actions/upload-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: azure-readiness.json
          if-no-files-found: error
          retention-days: 90
      - name: Record readiness evidence in job summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_id="unavailable"
          if [[ -f azure-readiness.json ]]; then
            receipt_id="$(jq -r '.receipt_id' azure-readiness.json)"
          fi
          {
            echo "### Azure readiness"
            echo "- Receipt ID / SHA-256: \`$receipt_id\`"
            echo "- Artifact digest: \`${{ steps.upload_readiness.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed on aggregate readiness
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path azure-readiness.json \
            --assert-go \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

  publish-images:
    name: Build and publish immutable images
    needs: readiness-gate
    if: ${{ needs.readiness-gate.result == 'success' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      AZURE_PUBLISHER_CLIENT_ID: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}

    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download aggregate readiness receipt
        uses: actions/download-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness

      - name: Validate readiness before any registry mutation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path readiness/azure-readiness.json \
            --mode release-publish \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Sign in to Azure with publisher OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build release images once
        id: build
        shell: bash
        run: |
          set -euo pipefail
          acr_login_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ACR_NAME" \
            --query loginServer \
            --output tsv)"
          az acr login --name "$AZURE_ACR_NAME"

          release_tag="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api_tag="${acr_login_server}/wind-forecast-api:${release_tag}"
          frontend_tag="${acr_login_server}/wind-forecast-frontend:${release_tag}"

          docker build \
            --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --file Dockerfile \
            --tag "$api_tag" \
            .
          docker build \
            --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --file frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=/backend \
            --build-arg NGINX_CONFIG=nginx.azure.conf \
            --tag "$frontend_tag" \
            frontend

          echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$frontend_tag" >> "$GITHUB_OUTPUT"

      - name: Smoke test the exact API image before publication
        env:
          API_TAG: ${{ steps.build.outputs.api_tag }}
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$API_SMOKE_CONTAINER" \
            --publish 8000:8000 \
            "$API_TAG"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The release API image did not become healthy." >&2
          exit 1

      - name: Show API smoke logs on failure
        if: failure()
        env:
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: docker logs "$API_SMOKE_CONTAINER" || true

      - name: Stop API smoke container
        if: always()
        env:
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: docker rm --force "$API_SMOKE_CONTAINER" || true

      - name: Smoke test the exact frontend image before publication
        env:
          FRONTEND_TAG: ${{ steps.build.outputs.frontend_tag }}
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$FRONTEND_SMOKE_CONTAINER" \
            --add-host wind-forecast-api:host-gateway \
            --publish 8080:80 \
            "$FRONTEND_TAG"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The release frontend image did not become healthy." >&2
          exit 1

      - name: Show frontend smoke logs on failure
        if: failure()
        env:
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: docker logs "$FRONTEND_SMOKE_CONTAINER" || true

      - name: Stop frontend smoke container
        if: always()
        env:
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: docker rm --force "$FRONTEND_SMOKE_CONTAINER" || true

      - name: Publish images and capture registry digests
        id: publish
        env:
          API_TAG: ${{ steps.build.outputs.api_tag }}
          FRONTEND_TAG: ${{ steps.build.outputs.frontend_tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$API_TAG"
          docker push "$FRONTEND_TAG"

          api_image="$(docker image inspect "$API_TAG" --format '{{index .RepoDigests 0}}')"
          frontend_image="$(docker image inspect "$FRONTEND_TAG" --format '{{index .RepoDigests 0}}')"
          if [[ ! "$api_image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The published API image did not resolve to a digest." >&2
            exit 1
          fi
          if [[ ! "$frontend_image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The published frontend image did not resolve to a digest." >&2
            exit 1
          fi
          api_source_label="$(docker image inspect "$API_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          frontend_source_label="$(docker image inspect "$FRONTEND_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$api_source_label" != "$SOURCE_SHA" || "$frontend_source_label" != "$SOURCE_SHA" ]]; then
            echo "Published image OCI revision labels do not match the CI source SHA." >&2
            exit 1
          fi

          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"
          echo "api_source_label=$api_source_label" >> "$GITHUB_OUTPUT"
          echo "frontend_source_label=$frontend_source_label" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.publish.outputs.frontend_image }}
          API_SOURCE_LABEL: ${{ steps.publish.outputs.api_source_label }}
          FRONTEND_SOURCE_LABEL: ${{ steps.publish.outputs.frontend_source_label }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schema_version "wind_forecast.production_release_manifest.v2" \
            --arg source_sha "$SOURCE_SHA" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg release_run_id "$GITHUB_RUN_ID" \
            --arg release_attempt "$RELEASE_ATTEMPT" \
            --arg api_image "$API_IMAGE" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg api_source_label "$API_SOURCE_LABEL" \
            --arg frontend_source_label "$FRONTEND_SOURCE_LABEL" \
            '{
              schema_version: $schema_version,
              manifest_type: "release",
              source_sha: $source_sha,
              ci_run_id: $ci_run_id,
              release_run_id: $release_run_id,
              release_attempt: $release_attempt,
              api_image: $api_image,
              frontend_image: $frontend_image,
              api_source_label: $api_source_label,
              frontend_source_label: $frontend_source_label
            }' > release-manifest.json
          python scripts/validate_azure_workflow.py manifest \
            --path release-manifest.json \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-release-run-id "$GITHUB_RUN_ID"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish release summary
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.publish.outputs.frontend_image }}
        shell: bash
        run: |
          {
            echo "## Production release candidate"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- CI run: \`${{ github.event.workflow_run.id }}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Frontend image: \`${FRONTEND_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-plan:
    name: Plan Terraform production
    needs: publish-images
    if: ${{ needs.publish-images.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download aggregate readiness receipt
        uses: actions/download-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness

      - name: Validate readiness before Terraform initialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path readiness/azure-readiness.json \
            --mode release-plan \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Load immutable image references
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py manifest \
            --path release-manifest.json \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-release-run-id "$GITHUB_RUN_ID"
          echo "TF_VAR_api_image=$(jq -r '.api_image' release-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' release-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with production planner OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate Terraform plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=production.tfplan

      - name: Reject destructive or replacement changes before production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production show -json production.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Publish a non-sensitive plan summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Terraform production plan (pre-confirmation)"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
            echo
            echo '```json'
            terraform -chdir=infra/azure/terraform/production show -json production.tfplan | \
              jq '{resource_changes: [.resource_changes[]? | {address, actions: .change.actions}]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Apply approved Terraform plan and smoke test
    needs:
      - publish-images
      - terraform-plan
    if: ${{ needs.publish-images.result == 'success' && needs.terraform-plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}
      AZURE_BUDGET_ALERT_EMAIL: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      AZURE_BUDGET_START_DATE: ${{ vars.AZURE_BUDGET_START_DATE }}
      AZURE_BUDGET_END_DATE: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download aggregate readiness receipt
        uses: actions/download-artifact@v4
        with:
          name: azure-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: readiness

      - name: Validate readiness before Terraform initialization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py readiness-receipt \
            --path readiness/azure-readiness.json \
            --mode release-deploy \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --source-sha "$READINESS_SOURCE_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Validate the registered release manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py manifest \
            --path release-manifest.json \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-release-run-id "$GITHUB_RUN_ID"

      - name: Load immutable image references
        shell: bash
        run: |
          set -euo pipefail
          echo "TF_VAR_api_image=$(jq -r '.api_image' release-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' release-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with protected deployer OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate the exact plan to apply
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=production.tfplan

      - name: Reject destructive or replacement changes after production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production show -json production.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Apply the exact reviewed-run plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production apply -input=false production.tfplan

      - name: Capture deployed revision names
        shell: bash
        run: |
          set -euo pipefail
          echo "API_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw api_revision_name)" >> "$GITHUB_ENV"
          echo "FRONTEND_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw frontend_revision_name)" >> "$GITHUB_ENV"

      - name: Verify active image digests
        shell: bash
        run: |
          set -euo pipefail
          api_active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-api \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          frontend_active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-web \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          jq -n \
            --arg api_image "$api_active_image" \
            --arg frontend_image "$frontend_active_image" \
            '{api_image: $api_image, frontend_image: $frontend_image}' > active-images.json
          python scripts/validate_azure_workflow.py active-images \
            --manifest release-manifest.json \
            --observed active-images.json \
            --kind release

      - name: Smoke test public dashboard and allow-listed proxy
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-web \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          base_url="https://${fqdn}"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$base_url/backend/health" | \
              jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 36 ]]; then
              echo "The public API proxy did not become healthy." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/overview" >/dev/null
          curl --fail --silent --show-error "$base_url/forecast-replay" >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/performance" | \
            jq -e '.observation_count == 14' >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/monitoring/latest" | \
            jq -e '.state == "available"' >/dev/null
          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/backend/predict")"
          [[ "$blocked_status" == "404" ]]
          echo "PUBLIC_URL=$base_url" >> "$GITHUB_ENV"

      - name: Start and verify the scheduled validation Job
        shell: bash
        run: |
          set -euo pipefail
          job_name="wind-forecast-validation"
          previous_execution="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --query '[0].name' \
            --output tsv 2>/dev/null || true)"
          az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --output none
          for attempt in $(seq 1 30); do
            latest_execution="$(az containerapp job execution list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --query '[0]' \
              --output json 2>/dev/null || echo '{}')"
            execution_name="$(jq -r '.name // empty' <<< "$latest_execution")"
            status="$(jq -r '.properties.status // empty' <<< "$latest_execution")"
            if [[ -z "$execution_name" || "$execution_name" == "$previous_execution" ]]; then
              sleep 10
              continue
            fi
            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed|Canceled|TimedOut)
                echo "Validation Job ended with status ${status}." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Validation Job did not finish within the smoke-test window." >&2
          exit 1

      - name: Verify Terraform state is drift-free after deployment
        id: post_deployment_drift
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_terraform_drift.py \
            --directory infra/azure/terraform/production \
            --plan-path post-deployment.tfplan \
            --operation deployment

      - name: Create release receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            '{public_dashboard: true,
              proxy_health: true,
              performance_endpoint: true,
              monitoring_endpoint: true,
              prediction_blocked: true,
              validation_job: true}' > smoke-tests.json
          python scripts/create_azure_receipt.py receipt \
            --operation release \
            --manifest release-manifest.json \
            --active-images active-images.json \
            --smoke-tests smoke-tests.json \
            --api-revision "$API_REVISION_NAME" \
            --frontend-revision "$FRONTEND_REVISION_NAME" \
            --terraform-post-plan-exit-code "${{ steps.post_deployment_drift.outputs.plan_exit_code }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output release-receipt.json

      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-release-receipt-${{ github.run_id }}
          path: |
            release-manifest.json
            release-receipt.json
            readiness/azure-readiness.json
            active-images.json
            smoke-tests.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Public URL: ${PUBLIC_URL}"
            echo "- API image: \`$(jq -r '.api_image' release-manifest.json)\`"
            echo "- Frontend image: \`$(jq -r '.frontend_image' release-manifest.json)\`"
            echo "- API revision: \`${API_REVISION_NAME}\`"
            echo "- Frontend revision: \`${FRONTEND_REVISION_NAME}\`"
            echo "- Readiness receipt: \`$(jq -r '.receipt_id' readiness/azure-readiness.json)\`"
            echo "- Terraform plan: applied after the protected \`production\` maintainer confirmation"
          } >> "$GITHUB_STEP_SUMMARY"
