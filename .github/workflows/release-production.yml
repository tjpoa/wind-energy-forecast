name: Release production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  publish-images:
    name: Build and publish immutable images
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      AZURE_PUBLISHER_CLIENT_ID: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}

    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      frontend_image: ${{ steps.publish.outputs.frontend_image }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate publisher configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_ACR_NAME
            AZURE_RESOURCE_GROUP
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_PUBLISHER_CLIENT_ID
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required release configuration is missing: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with publisher OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build release images once
        id: build
        shell: bash
        run: |
          set -euo pipefail
          acr_login_server="$(az acr show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_ACR_NAME" \
            --query loginServer \
            --output tsv)"
          az acr login --name "$AZURE_ACR_NAME"

          release_tag="${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api_tag="${acr_login_server}/wind-forecast-api:${release_tag}"
          frontend_tag="${acr_login_server}/wind-forecast-frontend:${release_tag}"

          docker build \
            --file Dockerfile \
            --tag "$api_tag" \
            .
          docker build \
            --file frontend/Dockerfile \
            --build-arg VITE_API_BASE_URL=/backend \
            --build-arg NGINX_CONFIG=nginx.azure.conf \
            --tag "$frontend_tag" \
            frontend

          echo "api_tag=$api_tag" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$frontend_tag" >> "$GITHUB_OUTPUT"

      - name: Smoke test the exact API image before publication
        env:
          API_TAG: ${{ steps.build.outputs.api_tag }}
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$API_SMOKE_CONTAINER" \
            --publish 8000:8000 \
            "$API_TAG"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The release API image did not become healthy." >&2
          exit 1

      - name: Show API smoke logs on failure
        if: failure()
        env:
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: docker logs "$API_SMOKE_CONTAINER" || true

      - name: Stop API smoke container
        if: always()
        env:
          API_SMOKE_CONTAINER: release-api-smoke-${{ github.run_id }}
        shell: bash
        run: docker rm --force "$API_SMOKE_CONTAINER" || true

      - name: Smoke test the exact frontend image before publication
        env:
          FRONTEND_TAG: ${{ steps.build.outputs.frontend_tag }}
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$FRONTEND_SMOKE_CONTAINER" \
            --publish 8080:80 \
            "$FRONTEND_TAG"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "The release frontend image did not become healthy." >&2
          exit 1

      - name: Show frontend smoke logs on failure
        if: failure()
        env:
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: docker logs "$FRONTEND_SMOKE_CONTAINER" || true

      - name: Stop frontend smoke container
        if: always()
        env:
          FRONTEND_SMOKE_CONTAINER: release-frontend-smoke-${{ github.run_id }}
        shell: bash
        run: docker rm --force "$FRONTEND_SMOKE_CONTAINER" || true

      - name: Publish images and capture registry digests
        id: publish
        env:
          API_TAG: ${{ steps.build.outputs.api_tag }}
          FRONTEND_TAG: ${{ steps.build.outputs.frontend_tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$API_TAG"
          docker push "$FRONTEND_TAG"

          api_image="$(docker image inspect "$API_TAG" --format '{{index .RepoDigests 0}}')"
          frontend_image="$(docker image inspect "$FRONTEND_TAG" --format '{{index .RepoDigests 0}}')"
          if [[ ! "$api_image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The published API image did not resolve to a digest." >&2
            exit 1
          fi
          if [[ ! "$frontend_image" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The published frontend image did not resolve to a digest." >&2
            exit 1
          fi

          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Create release manifest
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.publish.outputs.frontend_image }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg schema_version "1" \
            --arg source_sha "$SOURCE_SHA" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg release_run_id "$GITHUB_RUN_ID" \
            --arg release_attempt "$RELEASE_ATTEMPT" \
            --arg api_image "$API_IMAGE" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            '{
              schema_version: $schema_version,
              source_sha: $source_sha,
              ci_run_id: $ci_run_id,
              release_run_id: $release_run_id,
              release_attempt: $release_attempt,
              api_image: $api_image,
              frontend_image: $frontend_image
            }' > release-manifest.json
          jq -e \
            --arg expected_sha "$SOURCE_SHA" \
            '.source_sha == $expected_sha and
             (.api_image | test("@sha256:[0-9a-f]{64}$")) and
             (.frontend_image | test("@sha256:[0-9a-f]{64}$"))' \
            release-manifest.json >/dev/null

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish release summary
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          FRONTEND_IMAGE: ${{ steps.publish.outputs.frontend_image }}
        shell: bash
        run: |
          {
            echo "## Production release candidate"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- CI run: \`${{ github.event.workflow_run.id }}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Frontend image: \`${FRONTEND_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-plan:
    name: Plan Terraform production
    needs: publish-images
    if: ${{ needs.publish-images.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
      TF_VAR_environment_name: ${{ vars.AZURE_ENVIRONMENT_NAME || 'wind-forecast-demo-env' }}
      TF_VAR_runtime_identity_name: ${{ vars.AZURE_RUNTIME_IDENTITY_NAME || 'wind-forecast-demo-runtime' }}
      TF_VAR_publisher_principal_id: ${{ secrets.AZURE_PUBLISHER_PRINCIPAL_ID }}
      TF_VAR_planner_principal_id: ${{ secrets.AZURE_PLANNER_PRINCIPAL_ID }}
      TF_VAR_deployer_principal_id: ${{ secrets.AZURE_DEPLOYER_PRINCIPAL_ID }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Validate planning configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_ACR_NAME
            AZURE_RESOURCE_GROUP
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            TFSTATE_RESOURCE_GROUP_NAME
            TFSTATE_STORAGE_ACCOUNT_NAME
            ARM_CLIENT_ID
            TF_VAR_publisher_principal_id
            TF_VAR_planner_principal_id
            TF_VAR_deployer_principal_id
            TF_VAR_budget_alert_email
            TF_VAR_budget_start_date
            TF_VAR_budget_end_date
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required Terraform release configuration is missing: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Load immutable image references
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            --arg expected_sha "$SOURCE_SHA" \
            '.source_sha == $expected_sha and
             (.api_image | test("@sha256:[0-9a-f]{64}$")) and
             (.frontend_image | test("@sha256:[0-9a-f]{64}$"))' \
            release-manifest.json >/dev/null
          echo "TF_VAR_api_image=$(jq -r '.api_image' release-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' release-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate Terraform plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=production.tfplan

      - name: Publish a non-sensitive plan summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Terraform production plan (pre-approval)"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
            echo
            echo '```json'
            terraform -chdir=infra/azure/terraform/production show -json production.tfplan | \
              jq '{resource_changes: [.resource_changes[]? | {address, actions: .change.actions}]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Apply approved Terraform plan and smoke test
    needs:
      - publish-images
      - terraform-plan
    if: ${{ needs.publish-images.result == 'success' && needs.terraform-plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'westeurope' }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
      TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
      TF_VAR_environment_name: ${{ vars.AZURE_ENVIRONMENT_NAME || 'wind-forecast-demo-env' }}
      TF_VAR_runtime_identity_name: ${{ vars.AZURE_RUNTIME_IDENTITY_NAME || 'wind-forecast-demo-runtime' }}
      TF_VAR_publisher_principal_id: ${{ secrets.AZURE_PUBLISHER_PRINCIPAL_ID }}
      TF_VAR_planner_principal_id: ${{ secrets.AZURE_PLANNER_PRINCIPAL_ID }}
      TF_VAR_deployer_principal_id: ${{ secrets.AZURE_DEPLOYER_PRINCIPAL_ID }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the exact CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Validate deployment configuration and manifest
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_ACR_NAME
            AZURE_RESOURCE_GROUP
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            TFSTATE_RESOURCE_GROUP_NAME
            TFSTATE_STORAGE_ACCOUNT_NAME
            ARM_CLIENT_ID
            TF_VAR_publisher_principal_id
            TF_VAR_planner_principal_id
            TF_VAR_deployer_principal_id
            TF_VAR_budget_alert_email
            TF_VAR_budget_start_date
            TF_VAR_budget_end_date
          )
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required Terraform release configuration is missing: ${variable_name}" >&2
              exit 1
            fi
          done
          jq -e \
            --arg expected_sha "$SOURCE_SHA" \
            '.source_sha == $expected_sha and
             (.api_image | test("@sha256:[0-9a-f]{64}$")) and
             (.frontend_image | test("@sha256:[0-9a-f]{64}$"))' \
            release-manifest.json >/dev/null

      - name: Load immutable image references
        shell: bash
        run: |
          set -euo pipefail
          echo "TF_VAR_api_image=$(jq -r '.api_image' release-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' release-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with protected deployer OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate the exact plan to apply
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=production.tfplan

      - name: Reject destructive changes
        shell: bash
        run: |
          set -euo pipefail
          destructive_count="$(terraform -chdir=infra/azure/terraform/production show -json production.tfplan | \
            jq '[.resource_changes[]? | select((.change.actions // []) | index("delete"))] | length')"
          if [[ "$destructive_count" != "0" ]]; then
            echo "The protected production release contains ${destructive_count} destructive resource change(s)." >&2
            terraform -chdir=infra/azure/terraform/production show -json production.tfplan | \
              jq '[.resource_changes[]? | select((.change.actions // []) | index("delete")) | {address, actions: .change.actions}]' >&2
            exit 1
          fi

      - name: Apply the exact reviewed-run plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production apply -input=false production.tfplan

      - name: Capture deployed revision names
        shell: bash
        run: |
          set -euo pipefail
          echo "API_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw api_revision_name)" >> "$GITHUB_ENV"
          echo "FRONTEND_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw frontend_revision_name)" >> "$GITHUB_ENV"

      - name: Smoke test public dashboard and allow-listed proxy
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-web \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          base_url="https://${fqdn}"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$base_url/backend/health" | \
              jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 36 ]]; then
              echo "The public API proxy did not become healthy." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/overview" >/dev/null
          curl --fail --silent --show-error "$base_url/forecast-replay" >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/performance" | \
            jq -e '.observation_count == 14' >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/monitoring/latest" | \
            jq -e '.state == "available"' >/dev/null
          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/backend/predict")"
          [[ "$blocked_status" == "404" ]]
          echo "PUBLIC_URL=$base_url" >> "$GITHUB_ENV"

      - name: Start and verify the scheduled validation Job
        shell: bash
        run: |
          set -euo pipefail
          job_name="wind-forecast-validation"
          previous_execution="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --query '[0].name' \
            --output tsv 2>/dev/null || true)"
          az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --output none
          for attempt in $(seq 1 30); do
            latest_execution="$(az containerapp job execution list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --query '[0]' \
              --output json 2>/dev/null || echo '{}')"
            execution_name="$(jq -r '.name // empty' <<< "$latest_execution")"
            status="$(jq -r '.properties.status // empty' <<< "$latest_execution")"
            if [[ -z "$execution_name" || "$execution_name" == "$previous_execution" ]]; then
              sleep 10
              continue
            fi
            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed|Canceled|TimedOut)
                echo "Validation Job ended with status ${status}." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Validation Job did not finish within the smoke-test window." >&2
          exit 1

      - name: Verify Terraform state is drift-free after deployment
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform -chdir=infra/azure/terraform/production plan \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -out=post-deployment.tfplan
          plan_exit=$?
          set -e

          case "$plan_exit" in
            0)
              echo "Post-deployment Terraform plan is drift-free." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "Terraform detected drift after the protected deployment." >&2
              terraform -chdir=infra/azure/terraform/production show -json post-deployment.tfplan | \
                jq '[.resource_changes[]? | select((.change.actions // []) != ["no-op"]) | {address, actions: .change.actions}]' >&2
              exit 1
              ;;
            *)
              echo "Post-deployment Terraform plan failed with exit code ${plan_exit}." >&2
              exit "$plan_exit"
              ;;
          esac

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Public URL: ${PUBLIC_URL}"
            echo "- API image: \`$(jq -r '.api_image' release-manifest.json)\`"
            echo "- Frontend image: \`$(jq -r '.frontend_image' release-manifest.json)\`"
            echo "- API revision: \`${API_REVISION_NAME}\`"
            echo "- Frontend revision: \`${FRONTEND_REVISION_NAME}\`"
            echo "- Terraform plan: applied after the protected \`production\` approval"
          } >> "$GITHUB_STEP_SUMMARY"
