name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run pytest with coverage
        run: python -m pytest

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Run ruff
        run: python -m ruff check .

  frontend-quality:
    name: Frontend test, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend linting
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build FastAPI Docker image
        run: docker build --file Dockerfile --tag wind-energy-forecast-api:ci .

      - name: Run FastAPI Docker container
        run: docker run --detach --name wind-energy-forecast-api-ci --publish 8000:8000 wind-energy-forecast-api:ci

      - name: Smoke test /health
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent http://127.0.0.1:8000/health || true)"
            if [ "$response" = '{"status":"ok"}' ]; then
              echo "$response"
              exit 0
            fi
            sleep 2
          done
          docker logs wind-energy-forecast-api-ci
          exit 1

      - name: Check Docker health status
        run: |
          for attempt in {1..12}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' wind-energy-forecast-api-ci)"
            echo "container health: ${status}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs wind-energy-forecast-api-ci
              exit 1
            fi
            sleep 5
          done
          docker inspect wind-energy-forecast-api-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs wind-energy-forecast-api-ci

      - name: Stop Docker container
        if: always()
        run: docker rm --force wind-energy-forecast-api-ci || true

  frontend-docker-build:
    name: Frontend Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build --file frontend/Dockerfile --tag wind-energy-forecast-frontend:ci frontend

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  airflow-quality:
    name: Airflow image and DAG import
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Airflow Compose configuration
        env:
          AIRFLOW_ADMIN_USERNAME: ci-admin
          AIRFLOW_API_AUTH_JWT_SECRET: ci-only-${{ github.run_id }}
          AIRFLOW_DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@postgres/ci_airflow
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_airflow
        run: docker compose --env-file airflow/.env.example -f airflow/docker-compose.yml config --quiet

      - name: Build Airflow image
        run: docker build --file airflow/Dockerfile --tag wind-energy-forecast-airflow:ci .

      - name: Validate DAG imports
        run: |
          docker run --rm \
            -e WIND_FORECAST_AIRFLOW_ACTIVATION_DATE=2026-07-27 \
            -e WIND_FORECAST_BATCH_MODEL_BUNDLE=/tmp/model \
            -e WIND_FORECAST_BATCH_CALIBRATION_DIR=/tmp/calibration \
            wind-energy-forecast-airflow:ci \
            bash -c 'airflow db migrate && test "$(airflow dags list-import-errors --output=json)" = "[]"'

      - name: Run three-day offline DAG smoke
        run: |
          docker run --rm \
            -e WIND_FORECAST_AIRFLOW_ACTIVATION_DATE=2026-07-01 \
            -e WIND_FORECAST_BATCH_MODEL_BUNDLE=/tmp/model \
            -e WIND_FORECAST_BATCH_CALIBRATION_DIR=/tmp/calibration \
            wind-energy-forecast-airflow:ci \
            bash -c 'airflow db migrate >/dev/null && python /opt/wind-energy-forecast/airflow/tests/smoke_three_day_backfill.py'
