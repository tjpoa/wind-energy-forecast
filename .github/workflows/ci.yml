name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test and lint (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Configure Europe/Lisbon timezone contract
        run: Set-TimeZone -Id "GMT Standard Time"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run pytest with coverage
        run: python -m pytest

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Run ruff
        run: python -m ruff check .

  frontend-quality:
    name: Frontend test, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend linting
        run: npm run lint

      - name: Build frontend
        run: npm run build

  terraform-format:
    name: Terraform formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/azure/terraform

  terraform-validate:
    name: Terraform validation (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/azure/terraform/bootstrap
          - infra/azure/terraform/foundation
          - infra/azure/terraform/production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Initialize Terraform without a backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  tracked-artifact-safety:
    name: Tracked deployment-artifact safety
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked state, plans, variables, passwords, and client secrets
        run: python scripts/check_tracked_forbidden_files.py

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build FastAPI Docker image
        run: docker build --build-arg SOURCE_SHA=${{ github.sha }} --file Dockerfile --tag wind-energy-forecast-api:ci .

      - name: Run FastAPI Docker container
        run: docker run --detach --name wind-energy-forecast-api-ci --publish 8000:8000 wind-energy-forecast-api:ci

      - name: Smoke test /health
        run: |
          for attempt in {1..30}; do
            response="$(curl --fail --silent http://127.0.0.1:8000/health || true)"
            if [ "$response" = '{"status":"ok"}' ]; then
              echo "$response"
              exit 0
            fi
            sleep 2
          done
          docker logs wind-energy-forecast-api-ci
          exit 1

      - name: Check Docker health status
        run: |
          for attempt in {1..12}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' wind-energy-forecast-api-ci)"
            echo "container health: ${status}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs wind-energy-forecast-api-ci
              exit 1
            fi
            sleep 5
          done
          docker inspect wind-energy-forecast-api-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs wind-energy-forecast-api-ci

      - name: Stop Docker container
        if: always()
        run: docker rm --force wind-energy-forecast-api-ci || true

  frontend-docker-build:
    name: Frontend Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build --build-arg SOURCE_SHA=${{ github.sha }} --file frontend/Dockerfile --tag wind-energy-forecast-frontend:ci frontend

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  demo-compose-smoke:
    name: Reproducible demo Compose smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start stack and verify dashboard flow
        run: python scripts/smoke_demo_stack.py

  demo-browser-e2e:
    name: Reproducible demo browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start reproducible demo stack
        working-directory: .
        run: docker compose up --build --detach --wait

      - name: Run browser tests against Compose
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Show Compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Stop reproducible demo stack
        if: always()
        working-directory: .
        run: docker compose down --remove-orphans

  operational-projection-postgres:
    name: Operational projection PostgreSQL 16
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-bootstrap-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_PASSWORD: ci-migrator-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_PASSWORD: ci-writer-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_READER_PASSWORD: ci-reader-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_ENVIRONMENT_ID: local
      WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install projection test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Select an ephemeral loopback port
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket

          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(f"WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT={listener.getsockname()[1]}")
          PY

      - name: Configure role-specific test DSNs
        run: |
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_DSN=postgresql://wf_projection_migrator:${WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_DSN=postgresql://wf_projection_writer:${WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_READER_DSN=postgresql://wf_projection_reader:${WIND_FORECAST_OPERATIONAL_PROJECTION_READER_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"

      - name: Validate dedicated Compose configuration
        run: |
          docker compose \
            -f operational_projection/docker-compose.yml \
            -f operational_projection/docker-compose.test.yml \
            config --quiet

      - name: Start isolated PostgreSQL 16
        run: |
          docker compose \
            --project-name wind-projection-ci \
            -f operational_projection/docker-compose.yml \
            -f operational_projection/docker-compose.test.yml \
            up --detach --wait

      - name: Test migrations, schema, roles, and query reader
        run: |
          python -m pytest --no-cov \
            tests/test_operational_projection_migrations.py \
            tests/test_operational_projection_reader.py

      - name: Run projection lint
        run: |
          python -m ruff check \
            src/wind_forecast/config.py \
            src/wind_forecast/operational_api.py \
            src/wind_forecast/operational_query.py \
            src/wind_forecast/operational_projection_reader.py \
            src/wind_forecast/operational_projection_migrations.py \
            scripts/manage_operational_projection.py \
            tests/test_operational_api.py \
            tests/test_operational_query.py \
            tests/test_operational_projection_migrations.py \
            tests/test_operational_projection_reader.py

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker logs wind-projection-ci-postgres-1

      - name: Remove ephemeral PostgreSQL resources
        if: always()
        run: |
          docker compose \
            --project-name wind-projection-ci \
            -f operational_projection/docker-compose.yml \
            -f operational_projection/docker-compose.test.yml \
            down --volumes

  operational-projection-benchmark-smoke:
    name: Operational projection benchmark smoke
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-benchmark-bootstrap-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_PASSWORD: ci-benchmark-migrator-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_PASSWORD: ci-benchmark-writer-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_PROJECTION_READER_PASSWORD: ci-benchmark-reader-${{ github.run_id }}
      WIND_FORECAST_OPERATIONAL_ENVIRONMENT_ID: local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install benchmark test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Select an ephemeral loopback port
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket

          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(f"WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT={listener.getsockname()[1]}")
          PY

      - name: Configure role-specific benchmark DSNs
        run: |
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_DSN=postgresql://wf_projection_migrator:${WIND_FORECAST_OPERATIONAL_PROJECTION_MIGRATOR_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_DSN=postgresql://wf_projection_writer:${WIND_FORECAST_OPERATIONAL_PROJECTION_WRITER_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"
          echo "WIND_FORECAST_OPERATIONAL_PROJECTION_READER_DSN=postgresql://wf_projection_reader:${WIND_FORECAST_OPERATIONAL_PROJECTION_READER_PASSWORD}@127.0.0.1:${WIND_FORECAST_OPERATIONAL_PROJECTION_TEST_PORT}/wind_forecast_operational" >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL 16
        run: |
          docker compose \
            --project-name wind-projection-benchmark-ci \
            -f operational_projection/docker-compose.yml \
            -f operational_projection/docker-compose.test.yml \
            up --detach --wait

      - name: Test deterministic benchmark contracts
        run: python -m pytest --no-cov tests/test_operational_projection_benchmark.py

      - name: Run reduced benchmark smoke
        run: python scripts/benchmark_operational_projection.py --profile smoke

      - name: Lint benchmark implementation
        run: |
          python -m ruff check \
            scripts/benchmark_operational_projection.py \
            tests/test_operational_projection_benchmark.py

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker logs wind-projection-benchmark-ci-postgres-1

      - name: Remove ephemeral benchmark resources
        if: always()
        run: |
          docker compose \
            --project-name wind-projection-benchmark-ci \
            -f operational_projection/docker-compose.yml \
            -f operational_projection/docker-compose.test.yml \
            down --volumes

  airflow-quality:
    name: Airflow image and DAG import
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Airflow Compose configuration
        env:
          AIRFLOW_ADMIN_USERNAME: ci-admin
          AIRFLOW_API_AUTH_JWT_SECRET: ci-only-${{ github.run_id }}
          AIRFLOW_DATABASE_URL: postgresql+psycopg2://ci_user:ci_password@postgres/ci_airflow
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_airflow
        run: docker compose --env-file airflow/.env.example -f airflow/docker-compose.yml config --quiet

      - name: Build Airflow image
        run: docker build --file airflow/Dockerfile --tag wind-energy-forecast-airflow:ci .

      - name: Validate DAG imports
        run: |
          docker run --rm \
            -e WIND_FORECAST_AIRFLOW_ACTIVATION_DATE=2026-07-27 \
            -e WIND_FORECAST_BATCH_MODEL_BUNDLE=/tmp/model \
            -e WIND_FORECAST_BATCH_CALIBRATION_DIR=/tmp/calibration \
            wind-energy-forecast-airflow:ci \
            bash -c 'airflow db migrate && test "$(airflow dags list-import-errors --output=json | tail -n 1)" = "[]"'

      - name: Run three-day offline DAG smoke
        run: |
          docker run --rm \
            -e WIND_FORECAST_AIRFLOW_ACTIVATION_DATE=2026-07-01 \
            -e WIND_FORECAST_BATCH_MODEL_BUNDLE=/tmp/model \
            -e WIND_FORECAST_BATCH_CALIBRATION_DIR=/tmp/calibration \
            wind-energy-forecast-airflow:ci \
            bash -c 'airflow db migrate >/dev/null && python /opt/wind-energy-forecast/airflow/tests/smoke_three_day_backfill.py'

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - test-and-lint
      - frontend-quality
      - terraform-format
      - terraform-validate
      - tracked-artifact-safety
      - docker-build
      - frontend-docker-build
      - compose-validation
      - demo-compose-smoke
      - demo-browser-e2e
      - operational-projection-postgres
      - operational-projection-benchmark-smoke
      - airflow-quality

    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          TEST_AND_LINT_RESULT: ${{ needs['test-and-lint'].result }}
          FRONTEND_RESULT: ${{ needs['frontend-quality'].result }}
          TERRAFORM_FORMAT_RESULT: ${{ needs['terraform-format'].result }}
          TERRAFORM_VALIDATE_RESULT: ${{ needs['terraform-validate'].result }}
          TRACKED_ARTIFACT_RESULT: ${{ needs['tracked-artifact-safety'].result }}
          DOCKER_RESULT: ${{ needs['docker-build'].result }}
          FRONTEND_DOCKER_RESULT: ${{ needs['frontend-docker-build'].result }}
          COMPOSE_RESULT: ${{ needs['compose-validation'].result }}
          DEMO_COMPOSE_RESULT: ${{ needs['demo-compose-smoke'].result }}
          DEMO_BROWSER_RESULT: ${{ needs['demo-browser-e2e'].result }}
          PROJECTION_RESULT: ${{ needs['operational-projection-postgres'].result }}
          BENCHMARK_RESULT: ${{ needs['operational-projection-benchmark-smoke'].result }}
          AIRFLOW_RESULT: ${{ needs['airflow-quality'].result }}
        run: |
          set -euo pipefail
          results=(
            "$TEST_AND_LINT_RESULT"
            "$FRONTEND_RESULT"
            "$TERRAFORM_FORMAT_RESULT"
            "$TERRAFORM_VALIDATE_RESULT"
            "$TRACKED_ARTIFACT_RESULT"
            "$DOCKER_RESULT"
            "$FRONTEND_DOCKER_RESULT"
            "$COMPOSE_RESULT"
            "$DEMO_COMPOSE_RESULT"
            "$DEMO_BROWSER_RESULT"
            "$PROJECTION_RESULT"
            "$BENCHMARK_RESULT"
            "$AIRFLOW_RESULT"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job finished with status: $result" >&2
              exit 1
            fi
          done
