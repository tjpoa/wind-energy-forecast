name: Rollback production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "The successful release workflow run whose registered manifest will be restored"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-production-mutation
  cancel-in-progress: false

env:
  PRODUCTION_RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'wind-energy-forecast-demo' }}
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RELEASE_RUN_ID: ${{ inputs.release_run_id }}
  REQUEST_SHA: ${{ github.sha }}

jobs:
  validate-request:
    name: Validate rollback request
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the selected protected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Run protected Azure preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: rollback-request
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}

      - name: Validate release run id
        shell: bash
        run: python scripts/validate_azure_workflow.py run-id --value "$RELEASE_RUN_ID" --name release_run_id

      - name: Download the registered release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the registered release manifest
        shell: bash
        run: python scripts/validate_azure_workflow.py manifest --path release-manifest.json --expected-release-run-id "$RELEASE_RUN_ID"

      - name: Create rollback manifest
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(jq -r '.source_sha' release-manifest.json)"
          ci_run_id="$(jq -r '.ci_run_id' release-manifest.json)"
          api_image="$(jq -r '.api_image' release-manifest.json)"
          frontend_image="$(jq -r '.frontend_image' release-manifest.json)"
          jq -n \
            --arg schema_version "wind_forecast.production_rollback_manifest.v1" \
            --arg request_sha "$REQUEST_SHA" \
            --arg rollback_run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$source_sha" \
            --arg ci_run_id "$ci_run_id" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            --arg api_image "$api_image" \
            --arg frontend_image "$frontend_image" \
            '{
              schema_version: $schema_version,
              manifest_type: "rollback",
              request_sha: $request_sha,
              rollback_run_id: $rollback_run_id,
              source_sha: $source_sha,
              ci_run_id: $ci_run_id,
              release_run_id: $release_run_id,
              api_image: $api_image,
              frontend_image: $frontend_image
            }' > rollback-manifest.json
          python scripts/validate_azure_workflow.py rollback-manifest \
            --path rollback-manifest.json \
            --expected-rollback-run-id "$GITHUB_RUN_ID"

      - name: Upload rollback manifest
        uses: actions/upload-artifact@v4
        with:
          name: rollback-manifest
          path: rollback-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish rollback request summary
        shell: bash
        run: |
          {
            echo "## Production rollback request"
            echo
            echo "- Request commit: \`${REQUEST_SHA}\`"
            echo "- Registered release run: \`${RELEASE_RUN_ID}\`"
            echo "- Source SHA: \`$(jq -r '.source_sha' release-manifest.json)\`"
            echo "- API image: \`$(jq -r '.api_image' release-manifest.json)\`"
            echo "- Frontend image: \`$(jq -r '.frontend_image' release-manifest.json)\`"
            echo "- The protected \`production\` maintainer confirmation is still required."
          } >> "$GITHUB_STEP_SUMMARY"

  plan-rollback:
    name: Plan Terraform rollback
    needs: validate-request
    if: ${{ needs.validate-request.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      AZURE_PLANNER_CLIENT_ID: ${{ secrets.AZURE_PLANNER_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the selected protected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Run protected Azure preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: rollback-plan
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}

      - name: Download rollback manifest
        uses: actions/download-artifact@v4
        with:
          name: rollback-manifest

      - name: Validate rollback manifest and load image references
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py rollback-manifest \
            --path rollback-manifest.json \
            --expected-rollback-run-id "$GITHUB_RUN_ID"
          echo "TF_VAR_api_image=$(jq -r '.api_image' rollback-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' rollback-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate Terraform rollback plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=rollback.tfplan

      - name: Reject destructive or replacement changes before production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production show -json rollback.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Publish a non-sensitive rollback plan summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Terraform rollback plan (pre-confirmation)"
            echo
            echo "- API image: \`$(jq -r '.api_image' rollback-manifest.json)\`"
            echo "- Frontend image: \`$(jq -r '.frontend_image' rollback-manifest.json)\`"
            echo "- The binary plan remains on this ephemeral runner and is not uploaded."
            echo
            echo '```json'
            terraform -chdir=infra/azure/terraform/production show -json rollback.tfplan | \
              jq '{resource_changes: [.resource_changes[]? | {address, actions: .change.actions}]}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-production:
    name: Apply approved Terraform rollback and smoke test
    needs:
      - validate-request
      - plan-rollback
    if: ${{ needs.validate-request.result == 'success' && needs.plan-rollback.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TFSTATE_RESOURCE_GROUP_NAME: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TFSTATE_STORAGE_ACCOUNT_NAME: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      AZURE_DEPLOYER_CLIENT_ID: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_tfstate_resource_group_name: ${{ vars.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_VAR_tfstate_container_name: ${{ vars.TFSTATE_CONTAINER_NAME || 'tfstate' }}
      TF_VAR_budget_amount: ${{ vars.AZURE_BUDGET_AMOUNT || '10' }}
      TF_VAR_budget_alert_email: ${{ secrets.AZURE_BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_start_date: ${{ vars.AZURE_BUDGET_START_DATE }}
      TF_VAR_budget_end_date: ${{ vars.AZURE_BUDGET_END_DATE }}

    steps:
      - name: Check out the selected protected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Run protected Azure preflight
        uses: ./.github/actions/azure-preflight
        with:
          mode: rollback-deploy
          release-enabled: ${{ vars.PRODUCTION_RELEASE_ENABLED }}

      - name: Download rollback manifest
        uses: actions/download-artifact@v4
        with:
          name: rollback-manifest

      - name: Validate rollback manifest and load image references
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_azure_workflow.py rollback-manifest \
            --path rollback-manifest.json \
            --expected-rollback-run-id "$GITHUB_RUN_ID"
          echo "TF_VAR_api_image=$(jq -r '.api_image' rollback-manifest.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=$(jq -r '.frontend_image' rollback-manifest.json)" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Sign in to Azure with protected deployer OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize the production backend with OIDC
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/azure/terraform/production init \
            -reconfigure \
            -input=false \
            -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${TFSTATE_CONTAINER_NAME}" \
            -backend-config="key=production.tfstate"

      - name: Generate the exact rollback plan to apply
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production plan -input=false -lock-timeout=5m -out=rollback.tfplan

      - name: Reject destructive or replacement changes after production confirmation
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production show -json rollback.tfplan | python scripts/validate_azure_workflow.py plan --stdin

      - name: Apply the exact approved rollback plan
        shell: bash
        run: terraform -chdir=infra/azure/terraform/production apply -input=false rollback.tfplan

      - name: Capture rolled-back revision names
        shell: bash
        run: |
          set -euo pipefail
          echo "API_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw api_revision_name)" >> "$GITHUB_ENV"
          echo "FRONTEND_REVISION_NAME=$(terraform -chdir=infra/azure/terraform/production output -raw frontend_revision_name)" >> "$GITHUB_ENV"

      - name: Verify active image digests
        shell: bash
        run: |
          set -euo pipefail
          api_active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-api \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          frontend_active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-web \
            --query 'properties.template.containers[0].image' \
            --output tsv)"
          jq -n \
            --arg api_image "$api_active_image" \
            --arg frontend_image "$frontend_active_image" \
            '{api_image: $api_image, frontend_image: $frontend_image}' > active-images.json
          python scripts/validate_azure_workflow.py active-images \
            --manifest rollback-manifest.json \
            --observed active-images.json \
            --kind rollback

      - name: Smoke test public dashboard and allow-listed proxy
        shell: bash
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name wind-forecast-web \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          base_url="https://${fqdn}"
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$base_url/backend/health" | \
              jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 36 ]]; then
              echo "The public API proxy did not become healthy after rollback." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$base_url/overview" >/dev/null
          curl --fail --silent --show-error "$base_url/forecast-replay" >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/performance" | \
            jq -e '.observation_count == 14' >/dev/null
          curl --fail --silent --show-error "$base_url/backend/api/v1/monitoring/latest" | \
            jq -e '.state == "available"' >/dev/null
          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/backend/predict")"
          [[ "$blocked_status" == "404" ]]
          echo "PUBLIC_URL=$base_url" >> "$GITHUB_ENV"

      - name: Start and verify the scheduled validation Job
        shell: bash
        run: |
          set -euo pipefail
          job_name="wind-forecast-validation"
          previous_execution="$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --query '[0].name' \
            --output tsv 2>/dev/null || true)"
          az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$job_name" \
            --output none
          for attempt in $(seq 1 30); do
            latest_execution="$(az containerapp job execution list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$job_name" \
              --query '[0]' \
              --output json 2>/dev/null || echo '{}')"
            execution_name="$(jq -r '.name // empty' <<< "$latest_execution")"
            status="$(jq -r '.properties.status // empty' <<< "$latest_execution")"
            if [[ -z "$execution_name" || "$execution_name" == "$previous_execution" ]]; then
              sleep 10
              continue
            fi
            case "$status" in
              Succeeded)
                exit 0
                ;;
              Failed|Canceled|TimedOut)
                echo "Validation Job ended with status ${status} after rollback." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Validation Job did not finish within the rollback smoke-test window." >&2
          exit 1

      - name: Verify Terraform state is drift-free after rollback
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform -chdir=infra/azure/terraform/production plan \
            -detailed-exitcode \
            -input=false \
            -lock-timeout=5m \
            -out=post-rollback.tfplan
          plan_exit=$?
          set -e

          case "$plan_exit" in
            0)
              echo "Post-rollback Terraform plan is drift-free." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "Terraform detected drift after the protected rollback." >&2
              terraform -chdir=infra/azure/terraform/production show -json post-rollback.tfplan | \
                jq '[.resource_changes[]? | select((.change.actions // []) != ["no-op"]) | {address, actions: .change.actions}]' >&2
              exit 1
              ;;
            *)
              echo "Post-rollback Terraform plan failed with exit code ${plan_exit}." >&2
              exit "$plan_exit"
              ;;
          esac

      - name: Create rollback receipt
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            '{public_dashboard: true,
              proxy_health: true,
              performance_endpoint: true,
              monitoring_endpoint: true,
              prediction_blocked: true,
              validation_job: true}' > smoke-tests.json
          python scripts/create_azure_receipt.py receipt \
            --operation rollback \
            --manifest rollback-manifest.json \
            --active-images active-images.json \
            --smoke-tests smoke-tests.json \
            --api-revision "$API_REVISION_NAME" \
            --frontend-revision "$FRONTEND_REVISION_NAME" \
            --terraform-post-plan-exit-code 0 \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output rollback-receipt.json

      - name: Upload rollback receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-rollback-receipt-${{ github.run_id }}
          path: |
            rollback-manifest.json
            rollback-receipt.json
            active-images.json
            smoke-tests.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish rollback summary
        shell: bash
        run: |
          {
            echo "## Production rollback"
            echo
            echo "- Request commit: \`${REQUEST_SHA}\`"
            echo "- Public URL: ${PUBLIC_URL}"
            echo "- Registered release run: \`${RELEASE_RUN_ID}\`"
            echo "- API image: \`$(jq -r '.api_image' rollback-manifest.json)\`"
            echo "- Frontend image: \`$(jq -r '.frontend_image' rollback-manifest.json)\`"
            echo "- API revision: \`${API_REVISION_NAME}\`"
            echo "- Frontend revision: \`${FRONTEND_REVISION_NAME}\`"
            echo "- Terraform rollback plan: applied after the protected \`production\` maintainer confirmation"
          } >> "$GITHUB_STEP_SUMMARY"
